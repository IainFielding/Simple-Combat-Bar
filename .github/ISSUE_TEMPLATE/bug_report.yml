name: Bug report
description: Something on the combat bar doesn't work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Before you file: please try reproducing the problem with **only** this module
        and the D&D 5e system enabled. Most odd behaviour turns out to be a conflict
        with another module, and knowing that up front saves a lot of back-and-forth.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, and what you expected to happen instead.
      placeholder: |
        When a player clicked End Turn during a group turn, the whole group ended.
        I expected only that character's turn to end.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact clicks needed to see the problem. Say how many combatants there were and which were players, allies and enemies — that usually matters.
      placeholder: |
        1. Add 2 player characters and 3 goblins to a combat
        2. Roll initiative for everyone and start combat
        3. As a player, click End Turn on the first ally
        4. The bar skips the second ally
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      description: Which part of the module is involved? Pick the closest match.
      options:
        - Turn order / portraits on the bar
        - Initiative rolling
        - Group turns (allies / enemies acting together)
        - Action, bonus action and reaction pips
        - Tooltips, effects and attributes
        - Add Event (timed events in initiative)
        - GM controls or context menu
        - Module settings (GM options)
        - Performance or memory (the game slows down over a session)
        - Something else / not sure
    validations:
      required: true

  - type: input
    id: foundry-version
    attributes:
      label: Foundry VTT version
      description: Found in the bottom-left of the Foundry setup screen, e.g. 14.365.
      placeholder: "14.365"
    validations:
      required: true

  - type: input
    id: system-version
    attributes:
      label: D&D 5e system version
      description: Shown in Game Settings → Support & Issues, e.g. 6.0.5.
      placeholder: "6.0.5"
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: Simple Combat Bar version
      description: Shown in the Manage Modules list next to the module name.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: >-
        Press F12 to open the developer tools, switch to the Console tab, reproduce the
        problem, then paste any red error text here. This is automatically formatted as
        code, so no backticks needed.
      render: text

  - type: textarea
    id: content-modules
    attributes:
      label: Other combat modules in use
      description: >-
        Which other modules touch combat, tokens or the top of the screen? midi-qol, BG3 Inspired
        HUD, Dice So Nice, and so on. Other combat modules are a common cause of odd turn behaviour.
      placeholder: "midi-qol, BG3 Inspired HUD"

  - type: checkboxes
    id: isolated
    attributes:
      label: Confirmations
      options:
        - label: I reproduced this with only this module and the D&D 5e system enabled (plus any module needed to see it).
        - label: I searched the existing issues and this hasn't been reported yet.
          required: true
